<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pip-Boy Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0c120c;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      position: relative;
    }

    /* CRT scanline effect */
    body::before {
      content: " ";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    /* Screen flicker & vignette */
    body::after {
      content: " ";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: radial-gradient(
        circle at center,
        transparent 60%,
        rgba(0, 0, 0, 0.8) 100%
      );
      z-index: 3;
      pointer-events: none;
    }

    .terminal-text {
      color: #1bfd9c;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-shadow: 
        0 0 4px #1bfd9c,
        0 0 10px rgba(27, 253, 156, 0.7),
        0 0 25px rgba(27, 253, 156, 0.4);
      z-index: 1;
      animation: flicker 0.15s infinite alternate;
    }

    @keyframes flicker {
      0% {
        opacity: 0.96;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="terminal-text">Landplanner</div>
</body>
</html>
